<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUM KUTIJA | konfigurator</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
  <a href="index.html" class="back-nav">← Nazad na početni izbor</a>

  <div class="box-card">
    <header class="section-title-wrap">
      <h2>BUM KUTIJA</h2>
      <p>Personalizuj svoj poklon</p>
    </header>

    <div class="tabs" id="bumTabs">
      <button type="button" class="tab-btn active" data-pkg="empty">1. Prazna BUM kutija</button>
      <button type="button" class="tab-btn" data-pkg="sweets_gift">2. BUM kutija sa punjenim stranama (slatkiši / kafa)</button>
      <button type="button" class="tab-btn" data-pkg="only_sweets">3. BUM kutija punjena slatkišima / kafom</button>
      <button type="button" class="tab-btn" data-pkg="custom_gift">4. Personalizovani BUM poklon</button>
    </div>

    <form id="bumForm" onsubmit="event.preventDefault(); window.bumBox.sendWhatsApp();">
      <!-- Veličina kutije -->
      <div class="form-group">
        <label for="bumSizeSelect">Veličina kutije:</label>
        <select id="bumSizeSelect"></select>
        <div id="bumGiftDimInfo" class="gift-info-box"></div>
      </div>

      <!-- Željena boja -->
      <div class="form-group">
        <label for="bumColorInput">Željena boja:</label>
        <input type="text" id="bumColorInput" placeholder="npr. crna, crvena, ljubičasta, plava...">
      </div>

      <!-- Dekoracija enterijera kutije -->
      <div class="form-group">
        <label for="bumInteriorSelect">Dekoracija enterijera kutije (izaberi stil/motiv):</label>
        <select id="bumInteriorSelect" onchange="window.bumBox && window.bumBox.toggleCustomInterior(this.value)">
          <option value="Standardni" selected>✨ Standardni / bez dodataka</option>
          <option value="Pisani tekst">✍️ Pisani tekst</option>
          <option value="Štampani tekst">🖨️ Štampani tekst</option>
          <option value="Zvezdice">⭐ Zvezdice</option>
          <option value="Srca">❤️ Srca</option>
          <option value="IT stikeri">💻 IT stikeri</option>
          <option value="custom">✏️ Po sopstvenoj želji (unesi ispod)</option>
        </select>
        <!-- Polje za unos sopstvenog motiva enterijera -->
        <input type="text" id="bumCustomInteriorInput" style="display:none; margin-top:8px;" placeholder="Opiši željeni motiv enterijera (npr. zvezdano nebo, strip, cveće...)">
      </div>

      <!-- Stil bočnih ivica -->
   <div class="form-group custom-select-group">
  <label>Stil bočnih ivica:</label>
  
  <!-- Skriveni input koji pamti izabrani stil za WhatsApp -->
  <input type="hidden" id="selectedSideStyle" name="sideStyle" value="standard">

  <!-- Glavno dugme padajućeg menija -->
  <div class="custom-dropdown-btn" id="dropdownBtn" onclick="toggleSideDropdown()">
    <div class="selected-preview" id="dropdownCurrent">
      <span class="preview-text">✨ Standardni / bez dodataka</span>
    </div>
    <span class="dropdown-arrow">▼</span>
  </div>

  <!-- Padajuća lista sa sve 4 opcije i ilustracijama -->
  <div class="custom-dropdown-list" id="dropdownList">
    
    <!-- Opcija 1 -->
    <div class="dropdown-item selected" onclick="selectStyle('standard', '✨ Standardni / bez dodataka', this)">
      <div class="item-visual">
        <svg viewBox="0 0 100 100" class="mini-svg">
          <rect width="90" height="90" rx="14" fill="#150f24" stroke="#dfba68" stroke-width="6"/>
          <text x="50" y="58" font-size="40" text-anchor="middle" fill="#dfba68">✨</text>
        </svg>
      </div>
      <span class="item-title">Standardni / bez dodataka</span>
    </div>

    <!-- Opcija 2 -->
    <div class="dropdown-item" onclick="selectStyle('zvezda', '⭐ Zvezda (koverat u centar)', this)">
      <div class="item-visual">
        <svg viewBox="0 0 100 100" class="mini-svg">
          <rect width="90" height="90" rx="14" fill="#150f24" stroke="#a855f7" stroke-width="6"/>
          <line x1="5" y1="5" x2="95" y2="95" stroke="#c084fc" stroke-width="8"/>
          <line x1="95" y1="5" x2="5" y2="95" stroke="#c084fc" stroke-width="8"/>
          <circle cx="50" cy="50" r="14" fill="#c084fc"/>
        </svg>
      </div>
      <span class="item-title">Zvezda (koverat u centar)</span>
    </div>

    <!-- Opcija 3 -->
    <div class="dropdown-item" onclick="selectStyle('vertikalne-trake', '🎀 Tri trake (džepovi za slatkiše)', this)">
      <div class="item-visual">
        <svg viewBox="0 0 100 100" class="mini-svg">
          <rect width="90" height="90" rx="14" fill="#150f24" stroke="#a855f7" stroke-width="6"/>
          <rect x="18" y="15" width="16" height="70" rx="8" fill="#f59e0b"/>
          <rect x="42" y="15" width="16" height="70" rx="8" fill="#f59e0b"/>
          <rect x="66" y="15" width="16" height="70" rx="8" fill="#f59e0b"/>
        </svg>
      </div>
      <span class="item-title">Tri trake (džepovi za slatkiše)</span>
    </div>

    <!-- Opcija 4 -->
    <div class="dropdown-item" onclick="selectStyle('dijagonale', '📐 Dijagonalni preklopi', this)">
      <div class="item-visual">
        <svg viewBox="0 0 100 100" class="mini-svg">
          <rect width="90" height="90" rx="14" fill="#150f24" stroke="#a855f7" stroke-width="6"/>
          <line x1="10" y1="90" x2="90" y2="10" stroke="#f5e6b3" stroke-width="8"/>
        </svg>
      </div>
      <span class="item-title">Dijagonalni preklopi</span>
    </div>

  </div>
</div>

      <!-- Mehanizam (samo pop-up kocke) -->
      <div class="form-group">
        <label for="bumMechanismSelect">Unutrašnji mehanizam (sa konfetama):</label>
        <select id="bumMechanismSelect">
          <option value="cubes" selected>Iskačuće pop-up kocke</option>
        </select>
      </div>

      <!-- Izbor teme stranica (Slatkiši, Kafa ili Po sopstvenoj želji) -->
      <div class="form-group" id="sideThemeGroup" style="display:none;">
        <label for="bumSideThemeSelect">Punjenje stranica (izaberi temu):</label>
        <select id="bumSideThemeSelect" onchange="window.bumBox.switchSideTheme(this.value)">
          <option value="sweets" selected>🍫 Slatke strane (čokoladice i praline)</option>
          <option value="coffee">☕ Kafa strane (Nespresso / Dolce Gusto)</option>
          <option value="custom_sides">✨ Po sopstvenoj želji (unesi ispod)</option>
        </select>
      </div>

      <!-- Polje za unos sopstvenog punjenja stranica -->
      <div class="form-group" id="bumCustomSideGroup" style="display:none;">
        <label for="bumCustomSideInput">Opiši željeno punjenje stranica:</label>
        <input type="text" id="bumCustomSideInput" placeholder="npr. kozmetika, vaučeri, mini porukice, sitnice...">
      </div>

      <!-- Slatkiši za stranice -->
      <div class="form-group" id="bumSweetsGroup" style="display:none;">
        <label>Izaberi slatkiše za stranice (do 4 po strani):</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" value="ferrero" checked> Ferrero Rocher</label>
          <label class="checkbox-item"><input type="checkbox" value="raffaello" checked> Raffaello</label>
          <label class="checkbox-item"><input type="checkbox" value="lindor"> Lindt Lindor</label>
          <label class="checkbox-item"><input type="checkbox" value="mozart"> Mozart kugle</label>
        </div>
      </div>

      <!-- Kafa kapsule za stranice -->
      <div class="form-group" id="bumCoffeeGroup" style="display:none;">
        <label>Izaberi kapsule za kafu:</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" value="nespresso" checked> Nespresso kapsule</label>
          <label class="checkbox-item"><input type="checkbox" value="dolce_gusto"> Dolce Gusto kapsule</label>
        </div>
      </div>

      <!-- Polje za opis i posvetu -->
      <div class="form-group" id="customNotesGroup" style="display:none;">
        <label for="bumNotes">Opisi povod poklanjanja i temu kutije:</label>
        <textarea id="bumNotes" rows="3" placeholder="Poklon za 40ti rodjendan, Odlazak IT kolege, Baby shower, Baby reveal..."></textarea>
      </div>

      <!-- Dugme za naručivanje -->
      <button type="submit" class="submit-btn" style="margin-top: 25px;">Naruči BUM kutiju na WhatsApp 💬</button>
    </form>
  </div>
</div>

<script src="js/database.js"></script>
<script src="js/pricing-engine.js"></script>
<script src="js/bum-box.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
