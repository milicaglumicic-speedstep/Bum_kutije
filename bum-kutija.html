<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUM KUTIJA | Konfigurator</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
  <a href="index.html" class="back-nav">← Nazad na početni izbor</a>

  <div class="box-card">
    <header class="section-title-wrap">
      <h2>BUM KUTIJA KONFIGURATOR</h2>
      <p class="subtitle">Prilagodi dimenzije, boje, punjenje stranica, poklon ispod čepa i mehanizam iznenađenja.</p>
    </header>

    <form id="bumForm" onsubmit="event.preventDefault(); window.bumBox.sendWhatsApp();">
      
      <!-- 1. Veličina kutije -->
      <div class="form-group">
        <label for="bumSizeSelect">1. Veličina kutije:</label>
        <select id="bumSizeSelect">
          <option value="11x8x10">Standardna — 11 × 8 × 10 cm</option>
          <option value="15x15x12">Veća — 15 × 15 × 12 cm</option>
          <option value="custom">Custom (unesi D × Š × V)</option>
        </select>

        <!-- Polja za Custom dimenzije -->
        <div id="customDimSection" style="display:none; margin-top: 12px; background: rgba(147, 51, 234, 0.08); padding: 14px; border-radius: 10px; border: 1px solid var(--card-border);">
          <label style="margin-bottom: 8px; color: var(--accent-light);">Unesi željene dimenzije kutije (u cm):</label>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
            <div>
              <label for="customD" style="font-size:0.8rem;">Dužina (D)</label>
              <input type="number" id="customD" value="12" min="6" max="30" step="0.5">
            </div>
            <div>
              <label for="customS" style="font-size:0.8rem;">Širina (Š)</label>
              <input type="number" id="customS" value="12" min="6" max="30" step="0.5">
            </div>
            <div>
              <label for="customV" style="font-size:0.8rem;">Visina (V)</label>
              <input type="number" id="customV" value="10" min="6" max="30" step="0.5">
            </div>
          </div>
        </div>

        <div id="bumGiftDimInfo" class="gift-info-box"></div>
      </div>

      <!-- 2. Broj boja kutije (Dropdown) -->
      <div class="form-group">
        <label for="bumColorCountSelect">2. Broj boja kutije:</label>
        <select id="bumColorCountSelect">
          <option value="1">Jedna boja (cela kutija u istoj boji)</option>
          <option value="2">Dve boje (kombinacija osnovne i kontrastne boje)</option>
        </select>

        <div style="display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 12px;">
          <div>
            <label for="bumColor1Input" id="bumColor1Label">Željena boja kutije:</label>
            <input type="text" id="bumColor1Input" placeholder="npr. zlatna, bela, crna, crvena, puder roza...">
          </div>
          <div id="bumColor2Wrap" style="display:none;">
            <label for="bumColor2Input">Druga boja (čep i unutrašnji detalji):</label>
            <input type="text" id="bumColor2Input" placeholder="npr. bela, zlatna, srebrna...">
          </div>
        </div>
      </div>

      <!-- 3. Mehanizam iznenađenja (Dropdown) -->
      <div class="form-group">
        <label for="bumMechanismSelect">3. Unutrašnji mehanizam iznenađenja:</label>
        <select id="bumMechanismSelect">
          <option value="cubes">Iskačuće Pop-Up kocke</option>
          <option value="butterflies">Iskačući leteći leptirovi</option>
          <option value="combo">Combo (Pop-Up kocke + Leptirovi)</option>
        </select>
      </div>

      <!-- 4. Punjenje stranica (Dropdown + 1 vrsta slatkiša) -->
      <div class="form-group">
        <label for="bumSidesTypeSelect">4. Punjenje unutrašnjih stranica kutije:</label>
        <select id="bumSidesTypeSelect">
          <option value="sweets">🍫 Slatkiši na stranicama</option>
          <option value="decor_2d">🖼️ Ukrasi / 2D predmeti (fotografije, porukice)</option>
        </select>

        <!-- Izbor 1 vrste slatkiša za stranice -->
        <div id="sidesSweetsSection" style="margin-top: 12px;">
          <label for="bumSideSweetSelect">Izaberi slatkiš za stranice (jedna vrsta):</label>
          <select id="bumSideSweetSelect">
            <option value="kinder_cokoladica">Kinder čokolada</option>
            <option value="kinder_bueno">Kinder Bueno</option>
            <option value="ferrero">Ferrero Rocher</option>
            <option value="raffaello">Raffaello</option>
            <option value="giotto">Giotto</option>
          </select>
        </div>

        <!-- Opcije ako su izabrani UKRASI / 2D PREDMETI na stranicama -->
        <div id="sidesDecorSection" style="display:none; margin-top: 12px;">
          <label for="sidesDecorInput">Opiši ukrase / 2D predmete za stranice:</label>
          <input type="text" id="sidesDecorInput" placeholder="npr. 4 fotografije, kartice sa porukama, drveni 2D ukrasi, vaučer...">
        </div>
      </div>

      <!-- 5. Punjenje ispod čepa (Dropdown) -->
      <div class="form-group">
        <label for="underCapSelect">5. Punjenje ispod čepa (centralni poklon):</label>
        <select id="underCapSelect">
          <option value="sweets">🍬 Slatkiši</option>
          <option value="cosmetics">🌿 Prirodna kozmetika kombo (sapun, stik i labelo)</option>
          <option value="custom_gift">🎁 Personalizovani unos (sopstveni poklon ili želja)</option>
        </select>

        <!-- Sekcija A: Slatkiši ispod čepa -->
        <div id="underCapSweetsSection" style="margin-top: 12px;">
          <label for="bumUnderCapSweetSelect">Izaberi slatkiš ispod čepa:</label>
          <select id="bumUnderCapSweetSelect">
            <option value="kinder_cokoladica">Kinder čokolada</option>
            <option value="kinder_bueno">Kinder Bueno</option>
            <option value="ferrero">Ferrero Rocher</option>
            <option value="raffaello">Raffaello</option>
            <option value="giotto">Giotto</option>
          </select>
        </div>

        <!-- Sekcija B: Prirodna kozmetika kombo info -->
        <div id="underCapCosmeticsSection" style="display:none; margin-top: 12px;">
          <div class="gift-info-box">
            🌿 <strong>Kombo prirodne kozmetike uključuje:</strong> prirodni ručno rađeni sapun, prirodni dezodorans u stiku i prirodno labelo.
          </div>
        </div>

        <!-- Sekcija C: Personalizovani unos ispod čepa -->
        <div id="underCapCustomSection" style="display:none; margin-top: 12px;">
          <label for="underCapCustomNotes">Opiši šta ide ispod čepa (dimenzije ili opis poklona):</label>
          <textarea id="underCapCustomNotes" rows="3" placeholder="npr. Stavljam svoj parfem / sat, ili želim da vi ubacite određeni poklon..."></textarea>
        </div>
      </div>

      <!-- Dodatna napomena -->
      <div class="form-group">
        <label for="bumNotes">Dodatna napomena ili posveta (opciono):</label>
        <textarea id="bumNotes" rows="2" placeholder="Posebne želje, tekst posvete, rok izrade..."></textarea>
      </div>

      <button type="submit" class="submit-btn">Naruči BUM kutiju na WhatsApp 💬</button>
    </form>
  </div>
</div>

<script src="js/database.js"></script>
<script src="js/pricing-engine.js"></script>
<script src="js/bum-box.js"></script>
</body>
</html>
