<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUM KUTIJA | konfigurator</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
  <a href="index.html" class="back-nav">← Nazad na početni izbor</a>

  <div class="box-card">
    <header class="section-title-wrap">
      <h2>BUM KUTIJA</h2>
      <p>Personalizuj svoj poklon</p>
    </header>

    <div class="tabs" id="bumTabs">
      <button type="button" class="tab-btn active" data-pkg="empty">1. Prazna BUM kutija</button>
      <button type="button" class="tab-btn" data-pkg="sweets_gift">2. BUM kutija sa punjenim stranama (slatkiši / kafa)</button>
      <button type="button" class="tab-btn" data-pkg="only_sweets">3. BUM kutija punjena slatkišima / kafom</button>
      <button type="button" class="tab-btn" data-pkg="custom_gift">4. Personalizovani BUM poklon</button>
    </div>

    <form id="bumForm" onsubmit="event.preventDefault(); window.bumBox.sendWhatsApp();">
      <!-- Veličina kutije -->
      <div class="form-group">
        <label for="bumSizeSelect">Veličina kutije:</label>
        <select id="bumSizeSelect" onchange="window.bumBox && window.bumBox.updateSizeInfo ? window.bumBox.updateSizeInfo(this.value) : (document.getElementById('bumGiftDimInfo').innerHTML = this.value === '15x15x15' ? '📦 Unutrašnji prostor za poklon (centralni čep): <strong>10 × 10 × 12 cm</strong>' : (this.value === '18x18x18' ? '📦 Unutrašnji prostor za poklon (centralni čep): <strong>12 × 12 × 14 cm</strong>' : '📦 Unutrašnji prostor za poklon (centralni čep): <strong>14 × 14 × 16 cm</strong>'))">
          <option value="15x15x15" selected>Standardna (15 × 15 × 15 cm)</option>
          <option value="18x18x18">Srednja (18 × 18 × 18 cm)</option>
          <option value="20x20x20">Velika (20 × 20 × 20 cm)</option>
        </select>
        <div id="bumGiftDimInfo" class="gift-info-box">
          📦 Unutrašnji prostor za poklon (centralni čep): <strong>10
