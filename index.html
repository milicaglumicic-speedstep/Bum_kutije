<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUM KUTIJE | Custom Pokloni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0914;
      --card-bg: #151124;
      --card-border: #2b2244;
      --accent: #9333ea;
      --accent-light: #c084fc;
      --accent-hover: #7e22ce;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --silver: #cbd5e1;
      --input-bg: #0e0a1a;
      --success: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px 60px;
      background-image: radial-gradient(circle at top, rgba(147, 51, 234, 0.15) 0%, transparent 60%);
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 30px 0 20px;
    }

    .badge {
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      color: var(--accent-light);
      background: rgba(147, 51, 234, 0.12);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(192, 132, 252, 0.3);
      display: inline-block;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 25px 0 20px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      border-color: var(--accent-light);
      color: #fff;
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(147, 51, 234, 0.35);
    }

    .box-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--silver);
    }

    select, input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--accent-light);
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--input-bg);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.92rem;
      color: var(--text);
    }

    .checkbox-item input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
    }

    .price-box {
      background: rgba(147, 51, 234, 0.08);
      border: 1px dashed var(--accent-light);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin: 25px 0 20px;
    }

    .price-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .price-val {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      font-family: 'Fira Code', monospace;
    }

    .submit-btn {
      width: 100%;
      background: #25d366;
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .submit-btn:hover {
      background: #20ba59;
    }

    .submit-btn:active {
      transform: scale(0.99);
    }

    @media (max-width: 600px) {
      .tabs {
        grid-template-columns: 1fr;
      }
      .box-card {
        padding: 20px;
      }
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">GIFT SHOP</div>
    <h1>BUM KUTIJA</h1>
    <p class="subtitle">Izaberi svoju konfiguraciju, prilagodi detalje i pošalji upit.</p>
  </header>

  <!-- 4 opcije kutija -->
  <div class="tabs">
    <button type="button" class="tab-btn active" onclick="switchPackage('empty')">1. Prazna BUM kutija</button>
    <button type="button" class="tab-btn" onclick="switchPackage('sweets_gift')">2. Slatkiši + mesto za poklon</button>
    <button type="button" class="tab-btn" onclick="switchPackage('only_sweets')">3. Samo sa slatkišima</button>
    <button type="button" class="tab-btn" onclick="switchPackage('custom_gift')">4. Personalizovana sa poklonom</button>
  </div>

  <div class="box-card">
    <form id="orderForm" onsubmit="event.preventDefault(); sendViaWhatsApp();">
      <input type="hidden" name="paket" id="packageInput" value="Prazna BUM kutija">

      <!-- Veličina -->
      <div class="form-group">
        <label for="sizeSelect">Veličina kutije:</label>
        <select id="sizeSelect" name="velicina" onchange="calculatePrice()">
          <option value="S">S (10 × 10 × 10 cm) — Kompaktna</option>
          <option value="M" selected>M (15 × 15 × 15 cm) — Standardna</option>
          <option value="L">L (20 × 20 × 20 cm) — Velika</option>
        </select>
      </div>

      <!-- Boja kao tekstualno polje -->
      <div class="form-group">
        <label for="colorInput">Željena boja hamera i detalja:</label>
        <input type="text" id="colorInput" name="boja" placeholder="npr. Kraljevski ljubičasta sa srebrnom trakom, crno-zlatna..." value="Kraljevski ljubičasta sa srebrnom trakom">
      </div>

      <!-- Izgled bočnih stranica -->
      <div class="form-group">
        <label for="sidesSelect">Stil bočnih stranica:</label>
        <select id="sidesSelect" name="bocne_stranice">
          <option value="Origami ojačani džepovi">Origami ojačani džepovi za slatkiše</option>
          <option value="Foto-okviri i poruke">Okviri za fotografije i posvete</option>
          <option value="Minimalističke ravne stranice">Minimalističke ravne stranice</option>
        </select>
      </div>

      <!-- Mehanizam -->
      <div class="form-group">
        <label for="mechanismSelect">Unutrašnji mehanizam:</label>
        <select id="mechanismSelect" name="mehanizam">
          <option value="6 iskačućih pop-up kocki">6 iskačućih pop-up kocki (sa elastičnim mehanizmom)</option>
          <option value="Iskačući leptirovi">Iskačući origami leptirovi</option>
          <option value="Kombinovano (Kocke + Leptiri)">Kombinovano (Kocke + Leptiri)</option>
        </select>
      </div>

      <!-- Slatkiši (prikazano za pakete sa slatkišima) -->
      <div class="form-group" id="sweetsGroup" style="display: none;">
        <label>Izaberi slatkiše za punjenje:</label>
        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" name="slatkisi" value="Ferrero Rocher" checked> Ferrero Rocher
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="slatkisi" value="Raffaello" checked> Raffaello
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="slatkisi" value="Kinder Bueno"> Kinder Bueno Mini
          </label>
        </div>
      </div>

      <!-- Personalizovani unos / Detalji o poklonu -->
      <div class="form-group" id="customNotesGroup" style="display: none;">
        <label for="customNotes">Opiši temu, povod, poklon ili posebne želje za dizajn:</label>
        <textarea id="customNotes" name="zelje" rows="3" placeholder="npr. Šta planirate da stavite na mesto za poklon, posebna posveta, stil..."></textarea>
      </div>

      <!-- Prikaz cene -->
      <div class="price-box">
        <div class="price-title">Okvirna cena konfiguracije</div>
        <div class="price-val" id="priceDisplay">2.800 RSD</div>
      </div>

      <button type="button" class="submit-btn" onclick="sendViaWhatsApp()">
        <span>Pošalji upit na WhatsApp</span> 💬
      </button>
    </form>
  </div>
</div>

<script>
  let currentPackage = 'empty';

  // Nazivi paketa
  const packageTitles = {
    empty: 'Prazna BUM kutija',
    sweets_gift: 'BUM kutija sa slatkišima i mestom za poklon',
    only_sweets: 'BUM kutija samo sa slatkišima',
    custom_gift: 'Personalizovana kutija sa poklonom'
  };

  // Matrica cena po veličinama (S, M, L)
  const priceCatalog = {
    empty: {
      S: 2400,
      M: 2800,
      L: 3400
    },
    sweets_gift: {
      S: 3600,
      M: 4200,
      L: 4900
    },
    only_sweets: {
      S: 3800,
      M: 4500,
      L: 5200
    },
    custom_gift: {
      S: 'Na upit (od ~4.800 RSD)',
      M: 'Na upit (od ~5.800 RSD)',
      L: 'Na upit (od ~6.800 RSD)'
    }
  };

  function switchPackage(pkg) {
    currentPackage = pkg;
    
    // Vizuelno označavanje aktivnog taba
    const tabs = document.querySelectorAll('.tab-btn');
    const order = ['empty', 'sweets_gift', 'only_sweets', 'custom_gift'];
    tabs.forEach((tab, index) => {
      tab.classList.toggle('active', order[index] === pkg);
    });

    // Prikaz/sakrivanje opcija za slatkiše
    const showSweets = (pkg === 'sweets_gift' || pkg === 'only_sweets' || pkg === 'custom_gift');
    document.getElementById('sweetsGroup').style.display = showSweets ? 'block' : 'none';

    // Prikaz/sakrivanje polja za želje i poklon
    const showNotes = (pkg === 'sweets_gift' || pkg === 'custom_gift');
    document.getElementById('customNotesGroup').style.display = showNotes ? 'block' : 'none';

    // Ažuriranje naziva
    document.getElementById('packageInput').value = packageTitles[pkg];

    calculatePrice();
  }

  function calculatePrice() {
    const size = document.getElementById('sizeSelect').value;
    const price = priceCatalog[currentPackage][size];
    
    if (typeof price === 'number') {
      document.getElementById('priceDisplay').innerText = price.toLocaleString('sr-RS') + ' RSD';
    } else {
      document.getElementById('priceDisplay').innerText = price;
    }
  }

  function sendViaWhatsApp() {
    // Broj telefona s međunarodnim kodom (bez znaka + i razmaka)
    const phone = "381644667485"; 

    const pkg = document.getElementById('packageInput').value;
    const size = document.getElementById('sizeSelect').value;
    const color = document.getElementById('colorInput').value.trim() || 'Po dogovoru';
    const sides = document.getElementById('sidesSelect').value;
    const mechanism = document.getElementById('mechanismSelect').value;
    const price = document.getElementById('priceDisplay').innerText;
    const notes = document.getElementById('customNotes').value.trim();

    // Sakupljanje odabranih slatkiša
    let sweetsList = [];
    if (currentPackage !== 'empty') {
      document.querySelectorAll('input[name="slatkisi"]:checked').forEach(el => {
        sweetsList.push(el.value);
      });
    }

    // Formatiranje poruke za WhatsApp
    let text = `Pozdrav! Šaljem upit za BUM KUTIJU 🎁\n\n` +
               `*Paket:* ${pkg}\n` +
               `*Veličina:* ${size}\n` +
               `*Željena boja:* ${color}\n` +
               `*Stil stranica:* ${sides}\n` +
               `*Mehanizam:* ${mechanism}\n` +
               `*Okvirna cena:* ${price}`;

    if (sweetsList.length > 0) {
      text += `\n*Izabrani slatkiši:* ${sweetsList.join(', ')}`;
    }

    if (notes !== '') {
      text += `\n*Posebne želje / Poklon:* ${notes}`;
    }

    // Otvaranje WhatsApp-a
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank');
  }

  // Inicijalni proračun na učitavanju
  calculatePrice();
</script>
</body>
</html>
