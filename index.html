<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUM KUTIJE | Custom Pokloni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0914;
      --card-bg: #151124;
      --card-border: #2b2244;
      --accent: #9333ea;
      --accent-light: #c084fc;
      --accent-hover: #7e22ce;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --silver: #cbd5e1;
      --input-bg: #0e0a1a;
      --success: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px 60px;
      background-image: radial-gradient(circle at top, rgba(147, 51, 234, 0.15) 0%, transparent 60%);
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 30px 0 20px;
    }

    .badge {
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      color: var(--accent-light);
      background: rgba(147, 51, 234, 0.12);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(192, 132, 252, 0.3);
      display: inline-block;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 25px 0 20px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      border-color: var(--accent-light);
      color: #fff;
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(147, 51, 234, 0.35);
    }

    .box-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--silver);
    }

    select, input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--accent-light);
    }

    /* Kartice za izbor stila stranica sa crtežima */
    .style-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .style-option {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .style-option:hover {
      border-color: var(--accent-light);
    }

    .style-option.selected {
      border-color: var(--accent-light);
      background: rgba(147, 51, 234, 0.18);
      box-shadow: 0 0 0 1px var(--accent-light);
    }

    .style-preview {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .style-preview svg {
      width: 32px;
      height: 32px;
    }

    .style-text {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      background: var(--input-bg);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.92rem;
      color: var(--text);
    }

    .checkbox-item input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
    }

    .price-box {
      background: rgba(147, 51, 234, 0.08);
      border: 1px dashed var(--accent-light);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin: 25px 0 20px;
    }

    .price-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .price-val {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      font-family: 'Fira Code', monospace;
    }

    .submit-btn {
      width: 100%;
      background: #25d366;
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .submit-btn:hover {
      background: #20ba59;
    }

    .submit-btn:active {
      transform: scale(0.99);
    }

    @media (max-width: 600px) {
      .tabs, .style-grid, .checkbox-group {
        grid-template-columns: 1fr;
      }
      .box-card {
        padding: 20px;
      }
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">GIFT SHOP</div>
    <h1>BUM KUTIJA</h1>
    <p class="subtitle">Izaberi svoju konfiguraciju, prilagodi detalje i pošalji upit.</p>
  </header>

  <!-- 4 opcije kutija -->
  <div class="tabs">
    <button type="button" class="tab-btn active" onclick="switchPackage('empty')">1. Prazna BUM kutija</button>
    <button type="button" class="tab-btn" onclick="switchPackage('sweets_gift')">2. BUM kutija sa slatkim stranama i mestom za poklon</button>
    <button type="button" class="tab-btn" onclick="switchPackage('only_sweets')">3. BUM kutija samo sa slatkišima</button>
    <button type="button" class="tab-btn" onclick="switchPackage('custom_gift')">4. Personalizovana BUM kutija sa poklonom</button>
  </div>

  <div class="box-card">
    <form id="orderForm" onsubmit="event.preventDefault(); sendViaWhatsApp();">
      <input type="hidden" name="paket" id="packageInput" value="Prazna BUM kutija">
      <input type="hidden" name="stil_stranice" id="sideStyleInput" value="Zvezda">

      <!-- Veličina kutije -->
      <div class="form-group">
        <label for="sizeSelect">Veličina kutije:</label>
        <select id="sizeSelect" name="velicina" onchange="calculatePrice()">
          <!-- Opcije se dinamički menjaju u zavisnosti od paketa -->
        </select>
      </div>

      <!-- Željena boja -->
      <div class="form-group">
        <label for="colorInput">Željena boja:</label>
        <input type="text" id="colorInput" name="boja" placeholder="crna, crvena, ljubicasta...">
      </div>

      <!-- Stil bočnih ivica sa vizuelnim prikazom -->
      <div class="form-group">
        <label>Stil bočnih ivica (za slatkiše):</label>
        <div class="style-grid">
          
          <!-- 1. Zvezda -->
          <div class="style-option selected" onclick="selectStyle('Zvezda', this)">
            <div class="style-preview">
              <svg viewBox="0 0 40 40" fill="none" stroke="#c084fc" stroke-width="1.8">
                <rect x="4" y="4" width="32" height="32" rx="3" stroke="#6b7280" />
                <path d="M4 4L36 36M36 4L4 36" />
                <circle cx="20" cy="20" r="3" fill="#c084fc" />
              </svg>
            </div>
            <span class="style-text">Zvezda (koverat u centar)</span>
          </div>

          <!-- 2. Dijagonalna zvezda -->
          <div class="style-option" onclick="selectStyle('Dijagonalna zvezda', this)">
            <div class="style-preview">
              <svg viewBox="0 0 40 40" fill="none" stroke="#c084fc" stroke-width="1.8">
                <rect x="4" y="4" width="32" height="32" rx="3" stroke="#6b7280" />
                <path d="M20 4L36 20L20 36L4 20Z" />
                <circle cx="20" cy="20" r="3" fill="#c084fc" />
              </svg>
            </div>
            <span class="style-text">Dijagonalna zvezda</span>
          </div>

          <!-- 3. X greda -->
          <div class="style-option" onclick="selectStyle('X greda', this)">
            <div class="style-preview">
              <svg viewBox="0 0 40 40" fill="none" stroke="#c084fc" stroke-width="2">
                <rect x="4" y="4" width="32" height="32" rx="3" stroke="#6b7280" />
                <line x1="6" y1="6" x2="34" y2="34" />
                <line x1="34" y1="6" x2="6" y2="34" />
                <circle cx="20" cy="9" r="2.5" fill="#f59e0b" stroke="none" />
                <circle cx="31" cy="20" r="2.5" fill="#f59e0b" stroke="none" />
                <circle cx="20" cy="31" r="2.5" fill="#f59e0b" stroke="none" />
                <circle cx="9" cy="20" r="2.5" fill="#f59e0b" stroke="none" />
              </svg>
            </div>
            <span class="style-text">X greda (dijagonale)</span>
          </div>

          <!-- 4. Stepenik -->
          <div class="style-option" onclick="selectStyle('Stepenik', this)">
            <div class="style-preview">
              <svg viewBox="0 0 40 40" fill="none" stroke="#c084fc" stroke-width="2">
                <rect x="4" y="4" width="32" height="32" rx="3" stroke="#6b7280" />
                <path d="M8 32H15V24H23V16H31V8" />
                <circle cx="11.5" cy="27" r="2.2" fill="#f59e0b" stroke="none" />
                <circle cx="19" cy="19.5" r="2.2" fill="#f59e0b" stroke="none" />
                <circle cx="27" cy="12" r="2.2" fill="#f59e0b" stroke="none" />
              </svg>
            </div>
            <span class="style-text">Stepenik (cik-cak kaskada)</span>
          </div>

        </div>
      </div>

      <!-- Mehanizam sa cenama prema poreklu materijala -->
      <div class="form-group">
        <label for="mechanismSelect">Unutrašnji mehanizam sa konfetama:</label>
        <select id="mechanismSelect" name="mehanizam" onchange="calculatePrice()">
          <option value="cubes" selected>Iskačuće pop-up kocke (ručni rad od debljeg hamera)</option>
          <option value="butterflies">Iskačući leteći leptirovi sa oprugom (+400 RSD)</option>
          <option value="combo">Kombinovano: Kocke + Leptirovi (+700 RSD)</option>
        </select>
      </div>

      <!-- Slatkiši (uključujući Lindor i Mozart kugle) -->
      <div class="form-group" id="sweetsGroup" style="display: none;">
        <label>Izaberi slatkiše za punjenje i stranice:</label>
        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" name="slatkisi" value="Ferrero Rocher" checked> Ferrero Rocher
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="slatkisi" value="Raffaello" checked> Raffaello
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="slatkisi" value="Lindt Lindor"> Lindt Lindor praline
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="slatkisi" value="Mozart kugle"> Mozart kugle
          </label>
        </div>
      </div>

      <!-- Polje za opis - samo za 4. kutiju (Personalizovanu) -->
      <div class="form-group" id="customNotesGroup" style="display: none;">
        <label for="customNotes">Opiši temu, povod, poklon ili posebne želje za dizajn:</label>
        <textarea id="customNotes" name="zelje" rows="3" placeholder="Opiši poklon koji stavljaš, posvetu, tematske detalje..."></textarea>
      </div>

      <!-- Prikaz cene -->
      <div class="price-box">
        <div class="price-title">Okvirna cena konfiguracije</div>
        <div class="price-val" id="priceDisplay">2.800 RSD</div>
      </div>

      <button type="button" class="submit-btn" onclick="sendViaWhatsApp()">
        <span>Pošalji upit na WhatsApp</span> 💬
      </button>
    </form>
  </div>
</div>

<script>
  let currentPackage = 'empty';

  const packageTitles = {
    empty: 'Prazna BUM kutija',
    sweets_gift: 'BUM kutija sa slatkim stranama i mestom za poklon',
    only_sweets: 'BUM kutija samo sa slatkišima',
    custom_gift: 'Personalizovana BUM kutija sa poklonom'
  };

  // Osnovne cene (kocke od hamera su uračunate u bazu)
  const priceCatalog = {
    empty: {
      S: 2400,
      M: 2800,
      L: 3400
    },
    sweets_gift: {
      S: 3600,
      M: 4200,
      L: 4900
    },
    only_sweets: {
      M_SWEETS: 4300, // Za pakovanja 100g - 150g
      L_SWEETS: 5200  // Za pakovanja 200g - 250g
    },
    custom_gift: {
      S: 'Na upit (od ~4.800 RSD)',
      M: 'Na upit (od ~5.800 RSD)',
      L: 'Na upit (od ~6.800 RSD)'
    }
  };

  // Doplate za mehanizme
  const mechanismSurcharges = {
    cubes: 0,
    butterflies: 400,
    combo: 700
  };

  function updateSizeOptions() {
    const sizeSelect = document.getElementById('sizeSelect');
    sizeSelect.innerHTML = '';

    if (currentPackage === 'only_sweets') {
      // Tačno 2 veličine proračunate prema gramaži ispod čepa
      const opt1 = document.createElement('option');
      opt1.value = 'M_SWEETS';
      opt1.textContent = 'Midi (15 × 15 × 15 cm) — za pakovanja od 100g do 150g ispod čepa';
      opt1.selected = true;

      const opt2 = document.createElement('option');
      opt2.value = 'L_SWEETS';
      opt2.textContent = 'Maxi (18 × 18 × 18 cm) — za veće bombonjere od 200g do 250g ispod čepa';

      sizeSelect.appendChild(opt1);
      sizeSelect.appendChild(opt2);
    } else {
      // Standardne 3 veličine za ostale pakete
      const optS = document.createElement('option');
      optS.value = 'S';
      optS.textContent = 'S (10 × 10 × 10 cm) — Kompaktna';

      const optM = document.createElement('option');
      optM.value = 'M';
      optM.textContent = 'M (15 × 15 × 15 cm) — Standardna';
      optM.selected = true;

      const optL = document.createElement('option');
      optL.value = 'L';
      optL.textContent = 'L (18 × 18 × 18 cm / 20 cm) — Velika';

      sizeSelect.appendChild(optS);
      sizeSelect.appendChild(optM);
      sizeSelect.appendChild(optL);
    }
  }

  function selectStyle(styleName, el) {
    document.querySelectorAll('.style-option').forEach(opt => opt.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('sideStyleInput').value = styleName;
  }

  function switchPackage(pkg) {
    currentPackage = pkg;
    
    // Obeležavanje aktivnog taba
    const tabs = document.querySelectorAll('.tab-btn');
    const order = ['empty', 'sweets_gift', 'only_sweets', 'custom_gift'];
    tabs.forEach((tab, index) => {
      tab.classList.toggle('active', order[index] === pkg);
    });

    // Prikaz/sakrivanje slatkiša (paketi 2, 3 i 4)
    const showSweets = (pkg === 'sweets_gift' || pkg === 'only_sweets' || pkg === 'custom_gift');
    document.getElementById('sweetsGroup').style.display = showSweets ? 'block' : 'none';

    // Polje za opis se prikazuje SAMO za 4. paket (custom_gift)
    const showNotes = (pkg === 'custom_gift');
    document.getElementById('customNotesGroup').style.display = showNotes ? 'block' : 'none';

    // Ažuriranje skrivenog polja naziva
    document.getElementById('packageInput').value = packageTitles[pkg];

    // Postavljanje odgovarajućih veličina i proračun cene
    updateSizeOptions();
    calculatePrice();
  }

  function calculatePrice() {
    const size = document.getElementById('sizeSelect').value;
    const basePrice = priceCatalog[currentPackage][size];
    const mech = document.getElementById('mechanismSelect').value;
    const surcharge = mechanismSurcharges[mech] || 0;
    
    if (typeof basePrice === 'number') {
      const total = basePrice + surcharge;
      document.getElementById('priceDisplay').innerText = total.toLocaleString('sr-RS') + ' RSD';
    } else {
      document.getElementById('priceDisplay').innerText = basePrice || 'Na upit';
    }
  }

  function sendViaWhatsApp() {
    const phone = "381644667485"; 

    const pkg = document.getElementById('packageInput').value;
    const sizeSelect = document.getElementById('sizeSelect');
    const sizeText = sizeSelect.options[sizeSelect.selectedIndex].text;
    const color = document.getElementById('colorInput').value.trim() || 'Nije navedena (po dogovoru)';
    const sideStyle = document.getElementById('sideStyleInput').value;
    const mechSelect = document.getElementById('mechanismSelect');
    const mechanismText = mechSelect.options[mechSelect.selectedIndex].text;
    const price = document.getElementById('priceDisplay').innerText;
    const notes = document.getElementById('customNotes').value.trim();

    // Sakupljanje slatkiša
    let sweetsList = [];
    if (currentPackage !== 'empty') {
      document.querySelectorAll('input[name="slatkisi"]:checked').forEach(el => {
        sweetsList.push(el.value);
      });
    }

    let text = `Pozdrav! Šaljem upit za BUM KUTIJU 🎁\n\n` +
               `*Paket:* ${pkg}\n` +
               `*Veličina:* ${sizeText}\n` +
               `*Željena boja:* ${color}\n` +
               `*Stil bočnih ivica:* ${sideStyle}\n` +
               `*Mehanizam:* ${mechanismText}\n` +
               `*Okvirna cena:* ${price}`;

    if (sweetsList.length > 0) {
      text += `\n*Izabrani slatkiši:* ${sweetsList.join(', ')}`;
    }

    if (currentPackage === 'custom_gift' && notes !== '') {
      text += `\n*Opis i posebne želje za dizajn:* ${notes}`;
    }

    const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank');
  }

  // Inicijalno postavljanje
  updateSizeOptions();
  calculatePrice();
</script>
</body>
</html>
